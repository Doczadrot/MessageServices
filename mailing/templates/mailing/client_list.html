{% extends 'base.html' %}

{% block title %}
Список клиентов
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="my-4">Список клиентов</h1>
        <a href="{% url 'mailing:create_client' %}" class="btn btn-primary mb-3">
            Добавить клиента
        </a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">ФИО</th>
                    <th scope="col">Email</th>
                    <th scope="col">Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <th scope="row">{{ forloop.counter }}</th>
                    <td>{{ client.full_name }}</td>
                    <td>{{ client.email }}</td>
                    <td>
                        <a href="{% url 'mailing:client_detail' client.pk %}" class="btn btn-sm btn-info">Просмотр</a>
                        <a href="{% url 'mailing:update_client' client.pk %}" class="btn btn-sm btn-warning">Изменить</a>
                        <a href="{% url 'mailing:delete_client' client.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
