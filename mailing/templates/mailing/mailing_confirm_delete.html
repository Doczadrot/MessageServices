{% extends 'base.html' %}

{% block title %}
    Удаление рассылки
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 mx-auto">
            <h1 class="my-4 text-center">Удаление рассылки</h1>
            <div class="alert alert-danger">
                <p>Вы уверены, что хотите удалить рассылку "{{ mailing.title }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
