{% extends 'base.html' %}

{% block title %}
Подтверждение удаления клиента
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="my-4">Удаление клиента</h1>
        <div class="alert alert-danger" role="alert">
            Вы уверены, что хотите удалить клиента "{{ client.full_name }}"?
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
