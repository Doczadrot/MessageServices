{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Сброс пароля</h2>
    <p>Введите свой адрес электронной почты, чтобы получить инструкции по сбросу пароля.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сбросить пароль</button>
    </form>
</div>
{% endblock %}
