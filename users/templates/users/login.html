{% extends 'base.html' %}
{% load static %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h2 class="card-title text-center mb-4">Вход</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg mt-3">Войти</button>
                    </div>
                </form>
                <p class="text-center mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
                <p class="text-center mt-2"><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
