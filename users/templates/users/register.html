{% extends 'base.html' %}

{% block title %}
Регистрация нового пользователя
{% endblock %}

{% block content %}
<h1>Регистрация нового пользователя</h1>

{% if form.errors %}
<p class="error">Пожалуйста, исправьте ошибки в форме.</p>
{% endif %}

<form method="post" class="p-3 border rounded shadow-sm">
 {% csrf_token %}
 {{ form.as_p }}

      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
</form>

<p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
{% endblock %}
