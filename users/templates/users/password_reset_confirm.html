{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Введите новый пароль</h2>
    <p>Пожалуйста, введите свой новый пароль дважды, чтобы мы могли убедиться, что вы ввели его правильно.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сменить пароль</button>
    </form>
</div>
{% endblock %}
